packages:
  - "packages/*"

# Supply-chain hardening — see AGENTS.md.
minimumReleaseAge: 1440 # minutes (1 day)
trustPolicy: no-downgrade
engineStrict: true

# Exact-version provenance-gap exclusions (not package-wide bypasses).
trustPolicyExclude:
  - "undici-types@6.21.0"
  - "semver@6.3.1"
  - "chokidar@4.0.3"

# Replaces package.json onlyBuiltDependencies (ignored by pnpm 11).
allowBuilds:
  esbuild: true

# Same-major caret overrides for audit-failing transitive advisories.
overrides:
  esbuild: ">=0.28.1"
  nanoid@^3.0.0: "^3.3.17"
  postcss@^8.0.0: "^8.5.23"
  fast-uri@^3.0.0: "^3.1.6"
  "brace-expansion@^1.0.0": "^1.1.18"
  "brace-expansion@^5.0.0": "^5.0.9"
  "js-yaml@^3.0.0": "^3.15.2"
  "js-yaml@^4.0.0": "^4.3.2"
  browserslist@^4.0.0: "^4.28.7"
  colord@^2.0.0: "^2.9.4"
  "qs@^6.0.0": "^6.16.0"
  "baseline-browser-mapping@^2.0.0": "^2.11.0"
