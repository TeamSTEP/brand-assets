name: design-system CI

on:
  # Manual only — regenerates Playwright visual-regression baselines from *this* workflow's
  # actual ubuntu-latest runner and pushes them as a commit directly to the dispatched branch
  # (never main — the job refuses to run against it). Exists because no local Docker image,
  # however well-matched (including `act`, which approximates but does not bit-match the hosted
  # runner image), reliably bit-matches GitHub's hosted runner's font-rendering stack
  # (fontconfig/freetype/harfbuzz point versions drift independently of the pinned
  # Playwright/Chromium version) — see AGENTS.md Testing gotchas. Baselines regenerated any other
  # way (locally, via `act`, or otherwise) are not trustworthy and will likely fail `test-visual`
  # in the real `ci` job even when the underlying change is correct. Trigger via
  # `gh workflow run design-system-ci.yml --ref <branch> -f update-snapshots=true`; review the
  # resulting commit's image diff in the PR's Files Changed tab before merging — regenerating is
  # not the same as reviewing, and this workflow does not skip that step, it only relocates it to
  # where the PR review already happens.
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate visual-regression baselines and commit them to this branch"
        type: boolean
        default: true
  pull_request:
    paths:
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "package.json"
      - ".npmrc"
      - ".changeset/**"
      - ".github/workflows/design-system-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "package.json"
      - ".npmrc"
      - ".changeset/**"
      - ".github/workflows/design-system-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 (not the default shallow clone) so `origin/$BASE_REF` below has
          # history to diff against — changeset status --since and the changed-components
          # diff for the PR summary both need a real merge-base.
          fetch-depth: 0

      # Reads the "packageManager" field in package.json to fetch and pin the
      # exact pnpm version — CI must never run whatever pnpm happens to be on the runner's PATH.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile: fail instead of silently updating the lockfile. Combined with the
      # minimumReleaseAge / trustPolicy / allowBuilds settings in pnpm-workspace.yaml, this is
      # the supply-chain gate for the whole pipeline — see AGENTS.md CI/CD and review gates.
      - run: pnpm install --frozen-lockfile

      - id: audit
        continue-on-error: true
        run: pnpm audit

      # Fails the PR if publishable packages changed without a changeset. Only
      # meaningful on PRs, where there's a base ref to diff against. Skipped on the
      # changesets bot's own release PR (same-repo branch changeset-release/main): that
      # PR's version bumps are produced by consuming and deleting changesets, so it always
      # trips this check otherwise. Also requires head.repo == base repo so a fork can't
      # spoof the branch name to skip the gate.
      - id: changeset
        if: >-
          github.event_name == 'pull_request' &&
          !(github.head_ref == 'changeset-release/main' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

      # Chromium only — matches the scoped-footprint pattern used elsewhere in this repo
      # (stylelint rule scope, single-package installs); no need for firefox/webkit here.
      - run: pnpm --filter @teamstep/design-system exec playwright install --with-deps chromium

      # Each turbo task below is its own step (id + continue-on-error) instead of one combined
      # `pnpm turbo run lint check-contrast ...` invocation, so the PR summary job can report
      # per-gate pass/fail from native step outcomes rather than parsing turbo's internal run
      # summary format. turbo.json's own `dependsOn` graph (e.g. test-visual -> build-storybook,
      # check-api -> build) is still respected per-invocation, so this doesn't change what runs —
      # only that independent tasks (lint/check-types/check-contrast/test) that used to run in
      # parallel under one turbo invocation now run sequentially, trading some CI wall-clock time
      # for a gate breakdown that doesn't depend on turbo's internal JSON schema.
      - id: gate-lint
        continue-on-error: true
        run: pnpm turbo run lint

      - id: gate-check-contrast
        continue-on-error: true
        run: pnpm turbo run check-contrast

      - id: gate-test
        continue-on-error: true
        run: pnpm turbo run test

      - id: gate-check-types
        continue-on-error: true
        run: pnpm turbo run check-types

      - id: gate-check-api
        continue-on-error: true
        run: pnpm turbo run check-api

      - id: gate-build
        continue-on-error: true
        run: pnpm turbo run build

      - id: gate-build-storybook
        continue-on-error: true
        run: pnpm turbo run build-storybook

      - id: gate-test-visual
        continue-on-error: true
        run: pnpm turbo run test-visual

      # Not part of the turbo pipeline above: this reinstalls a real violation into a real
      # component file and asserts the gate catches it (see verify-governance.mjs), so it must
      # run after the rest of the pipeline has already built/verified a clean state, and its
      # non-cacheable rebuild-and-revert cost is deliberately paid on every run rather than
      # skipped when "nothing changed" — the whole point is re-proving enforcement is live, not
      # checking whether config files changed since last time.
      - id: gate-verify-governance
        continue-on-error: true
        run: pnpm --filter @teamstep/design-system run verify-governance

      # Every gate step above uses continue-on-error so later gates still run (and the PR
      # summary sees a full picture) even if an earlier one fails — this step is what actually
      # fails the job when that happens.
      - name: Evaluate gate results
        if: always()
        env:
          AUDIT: ${{ steps.audit.outcome }}
          CHANGESET: ${{ steps.changeset.outcome }}
          LINT: ${{ steps.gate-lint.outcome }}
          CHECK_CONTRAST: ${{ steps.gate-check-contrast.outcome }}
          TEST: ${{ steps.gate-test.outcome }}
          CHECK_TYPES: ${{ steps.gate-check-types.outcome }}
          CHECK_API: ${{ steps.gate-check-api.outcome }}
          BUILD: ${{ steps.gate-build.outcome }}
          BUILD_STORYBOOK: ${{ steps.gate-build-storybook.outcome }}
          TEST_VISUAL: ${{ steps.gate-test-visual.outcome }}
          VERIFY_GOVERNANCE: ${{ steps.gate-verify-governance.outcome }}
        run: |
          outcomes="$AUDIT $CHANGESET $LINT $CHECK_CONTRAST $TEST $CHECK_TYPES $CHECK_API $BUILD $BUILD_STORYBOOK $TEST_VISUAL $VERIFY_GOVERNANCE"
          echo "Gate outcomes: $outcomes"
          if echo "$outcomes" | grep -q failure; then
            echo "One or more gates failed — see step outcomes above."
            exit 1
          fi

      # Small machine-readable artifact for the pr-summary job below — kept separate from the
      # full playwright-report (screenshots/traces) so the sticky-comment job doesn't need to
      # download megabytes of images just to build a text summary.
      - name: Collect PR summary data
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p ci-summary
          cat <<EOF > ci-summary/gate-results.json
          {
            "audit": "${{ steps.audit.outcome }}",
            "changeset": "${{ steps.changeset.outcome }}",
            "lint": "${{ steps.gate-lint.outcome }}",
            "check-contrast": "${{ steps.gate-check-contrast.outcome }}",
            "test": "${{ steps.gate-test.outcome }}",
            "check-types": "${{ steps.gate-check-types.outcome }}",
            "check-api": "${{ steps.gate-check-api.outcome }}",
            "build": "${{ steps.gate-build.outcome }}",
            "build-storybook": "${{ steps.gate-build-storybook.outcome }}",
            "test-visual": "${{ steps.gate-test-visual.outcome }}",
            "verify-governance": "${{ steps.gate-verify-governance.outcome }}"
          }
          EOF

          # Changed components: unique component (or top-level src/) dirs touched by this PR,
          # so the summary comment names *what* changed without listing every file.
          git diff --name-only "origin/$BASE_REF...HEAD" -- packages/design-system/src \
            | sed -E 's#^packages/design-system/src/##' \
            | awk -F/ '{ if ($1 == "components" && $2 != "") print $1"/"$2; else print $1 }' \
            | sort -u \
            > ci-summary/changed-components.txt || true

          # Full repo-relative paths (not basenames) of every visual-baseline PNG this PR
          # touches — build-pr-summary.mjs needs the full path to compute each file's GitHub
          # diff-anchor hash (sha256 of the path, see that script), and the basename to parse
          # out which story/viewport it belongs to.
          git diff --name-only "origin/$BASE_REF...HEAD" \
            -- packages/design-system/tests/stories.visual.spec.ts-snapshots \
            > ci-summary/changed-snapshots.txt || true

          if [ -f packages/design-system/playwright-report/results.json ]; then
            cp packages/design-system/playwright-report/results.json ci-summary/visual-results.json
          fi

          # Storybook's id -> {title, name} index, so the summary comment can label each
          # changed snapshot by its real story name instead of a raw filename. Only exists if
          # the build-storybook gate above succeeded; the summary script tolerates its absence.
          if [ -f packages/design-system/storybook-static/index.json ]; then
            cp packages/design-system/storybook-static/index.json ci-summary/story-index.json
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/design-system/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci-summary/
          if-no-files-found: warn
          retention-days: 14

  update-visual-snapshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Refuse to touch main. This job commits directly to whatever branch it was dispatched
      # against — dispatching it with the default branch pre-selected (easy to do by accident
      # in the Actions UI) must not silently push "reviewed" baselines straight to main.
      - name: Guard against dispatching against main
        if: github.ref_name == 'main'
        run: |
          echo "::error::update-visual-snapshots must not run against main — dispatch it against the feature branch that needs new baselines."
          exit 1

      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @teamstep/design-system exec playwright install --with-deps chromium

      - run: pnpm turbo run build-storybook

      # continue-on-error: --update-snapshots still writes a screenshot for every test that
      # reaches that point, but a handful of stories can fail the axe a11y assertion that runs
      # *before* toHaveScreenshot in the same test (see stories.visual.spec.ts) on an unrelated,
      # known-flaky "Axe is already running" race — that shouldn't block uploading the snapshots
      # that were written for every other story.
      - id: update-snapshots
        continue-on-error: true
        run: pnpm --filter @teamstep/design-system run test-visual:update

      # Primary delivery mechanism: commit whatever was regenerated straight to the dispatched
      # branch. This does not skip human review of the pixel diff — it moves that review to the
      # PR's Files Changed tab (GitHub renders an image diff for changed PNGs), which is a review
      # surface that already exists and that this PR will already go through before merge, rather
      # than requiring a separate download-artifact-and-inspect-locally step first. `if: always()`
      # mirrors the artifact upload below: a partial failure in update-snapshots still writes
      # screenshots for every story that got that far, and those are still worth committing.
      - name: Commit regenerated baselines
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/design-system/tests/stories.visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(design-system): regenerate visual baselines from CI runner"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # Secondary debug aid, not the delivery mechanism — useful for inspecting what a failed
      # update-snapshots step produced without pulling the commit above locally first.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: packages/design-system/tests/stories.visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7

      - if: steps.update-snapshots.outcome == 'failure'
        run: |
          echo "::warning::test-visual:update had some non-screenshot failures (see the step above) — whatever screenshots were produced were still committed/uploaded. Review the PR's image diff before trusting them wholesale."

  pr-summary:
    needs: ci
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: ci-summary
          path: ci-summary

      - name: Build summary comment body
        run: |
          node .github/scripts/build-pr-summary.mjs ci-summary \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" \
            > pr-summary-body.md

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: design-system-ci-summary
          path: pr-summary-body.md
