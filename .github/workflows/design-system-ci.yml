name: design-system CI

on:
  # Snapshot regen on hosted runner only (font stack); dispatch feature branch, never main.
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate visual-regression baselines and commit them to this branch"
        type: boolean
        default: true
  pull_request:
    paths:
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "package.json"
      - ".npmrc"
      - ".changeset/**"
      - ".github/workflows/design-system-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "package.json"
      - ".npmrc"
      - ".changeset/**"
      - ".github/workflows/design-system-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for changeset --since / merge-base diffs.
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - id: audit
        continue-on-error: true
        run: pnpm audit

      # Skip changesets bot release PR and forks spoofing that branch name.
      - id: changeset
        if: >-
          github.event_name == 'pull_request' &&
          !(github.head_ref == 'changeset-release/main' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

      - run: pnpm --filter @teamstep/design-system exec playwright install --with-deps chromium

      # One turbo task per step so the PR summary gets native per-gate outcomes.
      - id: gate-lint
        continue-on-error: true
        run: pnpm turbo run lint

      - id: gate-check-contrast
        continue-on-error: true
        run: pnpm turbo run check-contrast

      - id: gate-test
        continue-on-error: true
        run: pnpm turbo run test

      - id: gate-check-types
        continue-on-error: true
        run: pnpm turbo run check-types

      - id: gate-check-api
        continue-on-error: true
        run: pnpm turbo run check-api

      - id: gate-build
        continue-on-error: true
        run: pnpm turbo run build

      - id: gate-build-storybook
        continue-on-error: true
        run: pnpm turbo run build-storybook

      - id: gate-test-visual
        continue-on-error: true
        run: pnpm turbo run test-visual

      - id: gate-verify-governance
        continue-on-error: true
        run: pnpm --filter @teamstep/design-system run verify-governance

      - name: Evaluate gate results
        if: always()
        env:
          AUDIT: ${{ steps.audit.outcome }}
          CHANGESET: ${{ steps.changeset.outcome }}
          LINT: ${{ steps.gate-lint.outcome }}
          CHECK_CONTRAST: ${{ steps.gate-check-contrast.outcome }}
          TEST: ${{ steps.gate-test.outcome }}
          CHECK_TYPES: ${{ steps.gate-check-types.outcome }}
          CHECK_API: ${{ steps.gate-check-api.outcome }}
          BUILD: ${{ steps.gate-build.outcome }}
          BUILD_STORYBOOK: ${{ steps.gate-build-storybook.outcome }}
          TEST_VISUAL: ${{ steps.gate-test-visual.outcome }}
          VERIFY_GOVERNANCE: ${{ steps.gate-verify-governance.outcome }}
        run: |
          outcomes="$AUDIT $CHANGESET $LINT $CHECK_CONTRAST $TEST $CHECK_TYPES $CHECK_API $BUILD $BUILD_STORYBOOK $TEST_VISUAL $VERIFY_GOVERNANCE"
          echo "Gate outcomes: $outcomes"
          if echo "$outcomes" | grep -q failure; then
            echo "One or more gates failed — see step outcomes above."
            exit 1
          fi

      - name: Collect PR summary data
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p ci-summary
          cat <<EOF > ci-summary/gate-results.json
          {
            "audit": "${{ steps.audit.outcome }}",
            "changeset": "${{ steps.changeset.outcome }}",
            "lint": "${{ steps.gate-lint.outcome }}",
            "check-contrast": "${{ steps.gate-check-contrast.outcome }}",
            "test": "${{ steps.gate-test.outcome }}",
            "check-types": "${{ steps.gate-check-types.outcome }}",
            "check-api": "${{ steps.gate-check-api.outcome }}",
            "build": "${{ steps.gate-build.outcome }}",
            "build-storybook": "${{ steps.gate-build-storybook.outcome }}",
            "test-visual": "${{ steps.gate-test-visual.outcome }}",
            "verify-governance": "${{ steps.gate-verify-governance.outcome }}"
          }
          EOF

          git diff --name-only "origin/$BASE_REF...HEAD" -- packages/design-system/src \
            | sed -E 's#^packages/design-system/src/##' \
            | awk -F/ '{ if ($1 == "components" && $2 != "") print $1"/"$2; else print $1 }' \
            | sort -u \
            > ci-summary/changed-components.txt || true

          git diff --name-only "origin/$BASE_REF...HEAD" \
            -- packages/design-system/tests/stories.visual.spec.ts-snapshots \
            > ci-summary/changed-snapshots.txt || true

          if [ -f packages/design-system/playwright-report/results.json ]; then
            cp packages/design-system/playwright-report/results.json ci-summary/visual-results.json
          fi

          if [ -f packages/design-system/storybook-static/index.json ]; then
            cp packages/design-system/storybook-static/index.json ci-summary/story-index.json
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/design-system/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci-summary/
          if-no-files-found: warn
          retention-days: 14

  update-visual-snapshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Guard against dispatching against main
        if: github.ref_name == 'main'
        run: |
          echo "::error::update-visual-snapshots must not run against main — dispatch it against the feature branch that needs new baselines."
          exit 1

      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @teamstep/design-system exec playwright install --with-deps chromium

      - run: pnpm turbo run build-storybook

      # continue-on-error: axe may fail before screenshots; still keep whatever was written.
      - id: update-snapshots
        continue-on-error: true
        run: pnpm --filter @teamstep/design-system run test-visual:update

      - name: Commit regenerated baselines
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/design-system/tests/stories.visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(design-system): regenerate visual baselines from CI runner"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: packages/design-system/tests/stories.visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7

      - if: steps.update-snapshots.outcome == 'failure'
        run: |
          echo "::warning::test-visual:update had some non-screenshot failures (see the step above) — whatever screenshots were produced were still committed/uploaded. Review the PR's image diff before trusting them wholesale."

  pr-summary:
    needs: ci
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: ci-summary
          path: ci-summary

      - name: Build summary comment body
        run: |
          node .github/scripts/build-pr-summary.mjs ci-summary \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" \
            > pr-summary-body.md

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: design-system-ci-summary
          path: pr-summary-body.md
