name: design-system CI

on:
  pull_request:
    paths:
      - "design-system/**"
      - ".github/workflows/design-system-ci.yml"
  push:
    branches: [main]
    paths:
      - "design-system/**"
      - ".github/workflows/design-system-ci.yml"

defaults:
  run:
    working-directory: design-system

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the "packageManager" field in design-system/package.json to fetch and pin the
      # exact pnpm version — CI must never run whatever pnpm happens to be on the runner's PATH.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: design-system/pnpm-lock.yaml

      # --frozen-lockfile: fail instead of silently updating the lockfile. Combined with the
      # minimumReleaseAge / trustPolicy / allowBuilds settings in pnpm-workspace.yaml, this is
      # the supply-chain gate for the whole pipeline — see CLAUDE.md step 9.
      - run: pnpm install --frozen-lockfile

      - run: pnpm audit

      - run: pnpm turbo run lint check-types check-api build build-storybook
